trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - '*'

jobs:
  - job: FormatAndTest
    displayName: "Run format and test checks"
    pool:
      name: Default
    variables:
      BASH_ENV: /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      NIX_CONFIG: extra-experimental-features = nix-command flakes
    steps:
      - checkout: self

      - script: |
          nix flake check
        displayName: "Run nix flake check"

  - job: Build
    displayName: "Build"
    dependsOn: FormatAndTest
    pool:
      name: Default
    variables:
      BASH_ENV: /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      NIX_CONFIG: extra-experimental-features = nix-command flakes
    steps:
      - checkout: self

      - script: |
          nix build
        displayName: "Build project"

      - task: PublishBuildArtifacts@1
        displayName: "Publish build artifact"
        inputs:
          PathtoPublish: 'result/_build/default/bin/main.exe'
          ArtifactName: 'aoc2024-build-artifact'
          publishLocation: 'Container'
